<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVT Test</title>
<style>
body{font-family:Arial;background:#0d1117;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:32px;width:340px;text-align:center}
h2{margin-bottom:20px;color:#4493f8}
.status{padding:12px;border-radius:8px;margin:10px 0;font-size:14px}
.ok{background:rgba(63,185,80,.15);color:#3fb950;border:1px solid rgba(63,185,80,.3)}
.err{background:rgba(248,81,73,.15);color:#f85149;border:1px solid rgba(248,81,73,.3)}
.wait{background:rgba(68,147,248,.15);color:#4493f8;border:1px solid rgba(68,147,248,.3)}
button{background:#4493f8;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="box">
  <h2>🔥 Firebase Connection Test</h2>
  <div id="status" class="status wait">Testing connection...</div>
  <div id="details" style="font-size:12px;color:#8b949e;margin-top:10px;line-height:1.6"></div>
  <button onclick="testConnection()">🔄 Retry</button>
</div>
<script>
const FB = "https://shopvisittracker-81420-default-rtdb.firebaseio.com";

async function testConnection() {
  const s = document.getElementById("status");
  const d = document.getElementById("details");
  s.className = "status wait";
  s.textContent = "Testing...";
  d.textContent = "";
  
  try {
    const url = FB + "/test.json";
    d.textContent = "Fetching: " + url;
    
    const r = await fetch(url, {method:"GET", mode:"cors"});
    d.textContent += "\nStatus: " + r.status;
    
    const text = await r.text();
    d.textContent += "\nResponse: " + text.slice(0,100);
    
    if (r.ok) {
      s.className = "status ok";
      s.textContent = "✅ Firebase Connected! Status: " + r.status;
      
      // Now write test data
      const w = await fetch(FB + "/test.json", {
        method:"PUT", mode:"cors",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({msg:"hello", time: new Date().toISOString()})
      });
      const wt = await w.text();
      d.textContent += "\nWrite test: " + w.status + " - " + wt.slice(0,50);
    } else {
      s.className = "status err";
      s.textContent = "❌ Error: HTTP " + r.status;
    }
  } catch(e) {
    s.className = "status err";
    s.textContent = "❌ " + e.message;
    d.textContent = "Error type: " + e.name + "\n" + e.stack;
  }
}

testConnection();
</script>
</body>
</html>
